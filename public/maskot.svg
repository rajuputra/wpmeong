<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Ears -->
  <polygon points="20,40 30,10 50,30" fill="#f4f4f5" stroke="#18181b" stroke-width="4" stroke-linejoin="round" />
  <polygon points="80,40 70,10 50,30" fill="#f4f4f5" stroke="#18181b" stroke-width="4" stroke-linejoin="round" />
  <!-- Face -->
  <circle cx="50" cy="55" r="40" fill="#f4f4f5" stroke="#18181b" stroke-width="4"/>
  <!-- Eyes -->
  <circle cx="35" cy="45" r="4" fill="#18181b"/>
  <circle cx="65" cy="45" r="4" fill="#18181b"/>
  <!-- Mouth / Nose -->
  <circle cx="50" cy="55" r="3" fill="#ef4444"/> <!-- pink nose -->
  <path d="M50,58 L50,65" stroke="#18181b" stroke-width="3" stroke-linecap="round"/>
  <path d="M50,65 Q45,70 35,62" fill="none" stroke="#18181b" stroke-width="3" stroke-linecap="round"/>
  <path d="M50,65 Q55,70 65,62" fill="none" stroke="#18181b" stroke-width="3" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="10" y1="50" x2="25" y2="52" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="55" x2="25" y2="55" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="60" x2="25" y2="58" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="50" x2="75" y2="52" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="55" x2="75" y2="55" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="60" x2="75" y2="58" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
</svg>
